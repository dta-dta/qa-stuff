<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Stuff</title>
  <style>
    :root {
      --bg: #030712;
      --bg-soft: #070b14;
      --card: #0b1220;
      --card-hover: #101a2d;
      --text: #f8fafc;
      --muted: #8b98aa;
      --border: #1b2738;
      --accent: #6366f1;
      --accent-dark: #4f46e5;
      --accent-soft: rgba(99, 102, 241, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79, 70, 229, .10), transparent 26%),
        radial-gradient(circle at 85% 15%, rgba(30, 64, 175, .08), transparent 24%),
        linear-gradient(180deg, #02040a 0%, #050914 100%);
      color: var(--text);
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 72px;
    }

    .hero { margin-bottom: 34px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 7px 10px;
      border: 1px solid rgba(99, 102, 241, .22);
      border-radius: 999px;
      background: var(--accent-soft);
      color: #c7d2fe;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(36px, 5vw, 54px);
      line-height: 1.04;
      letter-spacing: -.04em;
    }

    .hero p {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .tool-card {
      position: relative;
      display: flex;
      min-height: 245px;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(12, 19, 33, .99), rgba(8, 13, 24, .99));
      box-shadow: 0 20px 50px rgba(0, 0, 0, .36);
      text-decoration: none;
      color: inherit;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .tool-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, .16), transparent 38%);
      opacity: .55;
      transition: opacity .16s ease;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: #33445f;
      background: linear-gradient(180deg, rgba(16, 26, 45, .99), rgba(10, 17, 30, .99));
      box-shadow: 0 26px 60px rgba(0, 0, 0, .46);
    }

    .tool-card:hover::before { opacity: 1; }

    .icon {
      position: relative;
      z-index: 1;
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      margin-bottom: 20px;
      border: 1px solid rgba(99, 102, 241, .24);
      border-radius: 13px;
      background: var(--accent-soft);
      color: #c7d2fe;
      font-size: 19px;
      font-weight: 900;
    }

    .tool-card h2 {
      position: relative;
      z-index: 1;
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: -.02em;
    }

    .tool-card p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .card-footer {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid rgba(148, 163, 184, .10);
    }

    .open-label {
      color: #c7d2fe;
      font-size: 13px;
      font-weight: 800;
    }

    .arrow {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      transition: background .16s ease, transform .16s ease;
    }

    .tool-card:hover .arrow {
      background: var(--accent-dark);
      transform: translateX(2px);
    }

    .footer {
      margin-top: 28px;
      color: #475569;
      font-size: 12.5px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .tool-card { min-height: 210px; }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 24px, 1120px);
        padding: 34px 0 46px;
      }
      .hero { margin-bottom: 24px; }
      .tool-card { padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="eyebrow">QA Stuff</div>
      <h1>QA Stuff</h1>
      <p>
        Kleine Helfer für QA, Checks und Datenaufbereitung. Alles läuft direkt im Browser.
      </p>
    </section>

    <section class="grid" aria-label="Verfügbare QA-Tools">
      <a class="tool-card" href="artikelnummer_stueckzahl.html">
        <div>
          <div class="icon">QA</div>
          <h2>Artikelnummer + Stückzahl</h2>
          <p>
            Artikellisten einfügen und automatisch Artikelnummer sowie Stückzahl im Format Artikel=Anzahl extrahieren.
          </p>
        </div>
        <div class="card-footer">
          <span class="open-label">Tool öffnen</span>
          <span class="arrow" aria-hidden="true">→</span>
        </div>
      </a>
    </section>

    <div class="footer">QA Utilities · lokal im Browser</div>
  </main>
</body>
</html>
